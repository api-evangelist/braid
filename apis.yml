name: Braid
description: Braid Networks was a creator-economy startup that let creators build customizable landing
  pages unifying their work across the web (blog posts, videos, podcasts and commerce links), build
  mailing lists, and engage followers via text and push notifications. Founded by former Facebook
  product designer Matthew Cahill and software engineer Chris Piro, it raised a $6.8M seed round from
  Andreessen Horowitz (a16z) and Initialized Capital. Braid was a consumer direct-to-fan product and
  never published a public developer API. The company was acquired by Laurel on 2026-01-01 to power
  Laurel's Signal product and has since shut down; the braid.network domain no longer serves a site.
